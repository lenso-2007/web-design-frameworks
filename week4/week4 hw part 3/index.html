
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Remake</title>
    <link rel="stylesheet" href="assets/app.css">
</head>

<body class="bg-white text-black">

    <div class="p-8">

        <h1 class="text-3xl font-bold mb-8">Recommended Videos</h1>

        <div class="grid grid-cols-3 gap-8">

            <div>
                <img src="images/video1.jpg" class="w-full h-2em object-cover" alt="Music video">
                <h2 class="mt-2 font-bold">Top Charts 100</h2>
                <p>Music</p>
            </div>

            <div>
                <img src="images/video2.jpg" class="w-full h-2em object-cover" alt="Gaming video">
                <h2 class="mt-2 font-bold">Best Games This Year</h2>
                <p>Gaming</p>
            </div>

            <div>
                <img src="images/video3.webp" class="w-full h-2em object-cover" alt="Football video">
                <h2 class="mt-2 font-bold">Football Highlights</h2>
                <p>Sports</p>
            </div>

            <div>
                <img src="images/video4.jpeg" class="w-full h-2em object-cover" alt="Travel video">
                <h2 class="mt-2 font-bold">Exploring Ireland</h2>
                <p>Travel</p>
            </div>

            <div>
                <img src="images/video5.webp" class="w-full h-2em object-cover" alt="Cooking video">
                <h2 class="mt-2 font-bold">Easy Meals at Home</h2>
                <p>Cooking</p>
            </div>

            <div>
                <img src="images/video6.jpg" class="w-full h-2em object-cover" alt="Meme video">
                <h2 class="mt-2 font-bold">Funny Memes</h2>
                <p>Comedy</p>
            </div>

        </div>

    </div>

</body>
</html>
